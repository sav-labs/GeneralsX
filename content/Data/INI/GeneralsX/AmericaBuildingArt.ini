; GeneralsX content: modern art for USA base structures.
; Display-only like AmericaVehicleArt.ini: ArtRemap swaps the drawn models, the retail Draw modules,
; construction scaffolding, docks and exits stay as they are. Night and snow variants of a retail model
; draw the same new model. Retail parts drawn by extra Draw modules (reactor block, factory doors and
; crane, supply conveyor, headquarters radar and air conditioners) belong to the old building and are
; drawn as nothing.

