; GeneralsX content: modern art for USA jets.
; Same rules as AmericaVehicleArt.ini: only what is drawn changes. Logic keeps reading launch points from
; the retail models, and the afterburner sub-objects (BurnerFX01-04) keep their retail names so the
; JETAFTERBURNER states still show and hide them.

ArtRemap
  ; Raptor -> single-engine stealth multirole fighter
  Model = AVRaptor     AVGXF35
  Model = AVRaptor_D   AVGXF35_D
  Model = AVRaptor_D1B AVGXF35_D
  ; The aircraft carrier's Raptors (challenge maps) use the same airframe
  Model = PSCarRapt     AVGXF35
  Model = PSCarRapt_D   AVGXF35_D
  Model = PSCarRapt_D1B AVGXF35_D
  ; Stealth Fighter -> tailless flying-wing strike aircraft
  Model = AVStealth    AVGXWING
  Model = AVStealth_D  AVGXWING_D
  Model = AVStealth_D1 AVGXWING_D
  ; Aurora -> hypersonic arrowhead bomber
  Model = AVAurora     AVGXHYPER
  Model = AVAurora_D   AVGXHYPER_D
  Model = AVAurora_D1  AVGXHYPER_D
End

Object AmericaJetRaptor
  SelectPortrait = GXCameo_F35_L
  ButtonImage    = GXCameo_F35
End
CommandButton Command_ConstructAmericaJetRaptor
  ButtonImage = GXCameo_F35
End

Object AmericaJetStealthFighter
  SelectPortrait = GXCameo_Wing_L
  ButtonImage    = GXCameo_Wing
End
CommandButton Command_ConstructAmericaJetStealthFighter
  ButtonImage = GXCameo_Wing
End

Object AmericaJetAurora
  SelectPortrait = GXCameo_Hyper_L
  ButtonImage    = GXCameo_Hyper
End
CommandButton Command_ConstructAmericaJetAurora
  ButtonImage = GXCameo_Hyper
End
