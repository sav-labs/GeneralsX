; GeneralsX content: modern art for USA vehicles.
; Loaded as overrides before every game (like map.ini), so only the art changes:
; stats, weapons, sounds and behaviour stay exactly as in the retail game.

; Crusader -> modern main battle tank
Object AmericaTankCrusader
  SelectPortrait = GXCameo_MBT_L
  ButtonImage    = GXCameo_MBT

  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_01_GX
      DefaultConditionState
        Model               = AVGXMBT
        Turret              = Turret
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = REALLYDAMAGED
        Model               = AVGXMBT_D
      End
      ConditionState        = RUBBLE
        Model               = AVGXMBT_D
      End

      TrackMarks              = EXTnkTrack.tga
      TreadAnimationRate      = 2.0
      TreadDriveSpeedFraction = 0.3
      TreadPivotSpeedFraction = 0.6
      OkToChangeModelColor    = Yes
    End
  End
End

CommandButton Command_ConstructAmericaTankCrusader
  ButtonImage = GXCameo_MBT
End

; Paladin -> modern tank with reactive armour and a laser point-defence turret
Object AmericaTankPaladin
  SelectPortrait = GXCameo_Paladin_L
  ButtonImage    = GXCameo_Paladin

  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_01_GX
      ExtraPublicBone = Laser

      ConditionState        = NONE
        Model               = AVGXPAL
        Turret              = Turret01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = REALLYDAMAGED
        Model               = AVGXPAL_D
        Turret              = Turret01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End
      ConditionState        = RUBBLE
        Model               = AVGXPAL_D
        Turret              = Turret01
        WeaponFireFXBone    = PRIMARY TurretMS
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponLaunchBone    = PRIMARY TurretMS
      End

      TrackMarks              = EXTnkTrack.tga
      TreadAnimationRate      = 2.0
      TreadDriveSpeedFraction = 0.3
      TreadPivotSpeedFraction = 0.6
      OkToChangeModelColor    = Yes
    End
  End
End

CommandButton Command_ConstructAmericaVehiclePaladin
  ButtonImage = GXCameo_Paladin
End

; Dozer -> modern armoured bulldozer (no digging animation yet; the blade is fixed)
Object AmericaVehicleDozer
  SelectPortrait = GXCameo_Dozer_L
  ButtonImage    = GXCameo_Dozer

  ReplaceModule ModuleTag_01
    Draw = W3DTruckDraw ModuleTag_01_GX
      OkToChangeModelColor = Yes

      DefaultConditionState
        Model             = AVGXDOZ
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeLight
      End
      ConditionState = PREATTACK_A
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeHeavy
        ParticleSysBone   = DIRTFX01 DozerDirtFall
      End
      ConditionState = MOVING
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeHeavy
      End
      ConditionState      = REALLYDAMAGED RUBBLE
        Model             = AVGXDOZ_D
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeHeavy
      End
      ConditionState = PREATTACK_A REALLYDAMAGED RUBBLE
        Model             = AVGXDOZ_D
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeHeavy
      End
      ConditionState      = MOVING REALLYDAMAGED RUBBLE
        Model             = AVGXDOZ_D
        ParticleSysBone   = EXHAUSTFX01 DozerSmokeHeavy
      End

      TrackMarks          = EXTireTrack2.tga
      Dust                = RocketBuggyDust
      DirtSpray           = RocketBuggyDirtSpray
    End
  End
End

CommandButton Command_ConstructAmericaDozer
  ButtonImage = GXCameo_Dozer
End

; Comanche -> modern attack helicopter
Object AmericaVehicleComanche
  SelectPortrait = GXCameo_Apache_L
  ButtonImage    = GXCameo_Apache

  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_GX
      DefaultConditionState
        Model               = AVGXAPACHE
        HideSubObject       = MissileUpgrade
        Animation           = AVGXAPACHE.AVGXAPACHE
        AnimationMode       = LOOP
        WeaponMuzzleFlash   = PRIMARY TurretFX
        WeaponFireFXBone    = PRIMARY Muzzle
        WeaponFireFXBone    = SECONDARY WeaponA
        WeaponLaunchBone    = SECONDARY WeaponA
      End
      ConditionState = REALLYDAMAGED
        Model               = AVGXAPACHE_D
        Animation           = AVGXAPACHE_D.AVGXAPACHE_D
        AnimationMode       = LOOP
      End
      ConditionState = WEAPONSET_PLAYER_UPGRADE
        ShowSubObject       = MissileUpgrade
        Animation           = AVGXAPACHE.AVGXAPACHE
        AnimationMode       = LOOP
        WeaponFireFXBone    = TERTIARY WeaponB
        WeaponLaunchBone    = TERTIARY WeaponB
      End
      ConditionState = WEAPONSET_PLAYER_UPGRADE REALLYDAMAGED
        Model               = AVGXAPACHE_D
        ShowSubObject       = MissileUpgrade
        Animation           = AVGXAPACHE_D.AVGXAPACHE_D
        AnimationMode       = LOOP
        WeaponFireFXBone    = TERTIARY WeaponB
        WeaponLaunchBone    = TERTIARY WeaponB
      End
      ConditionState = RUBBLE
        Model               = AVGXAPACHE_D
        Animation           = AVGXAPACHE_D.AVGXAPACHE_D
        AnimationMode       = LOOP
      End
      ConditionState = RUBBLE SPECIAL_DAMAGED
        Model               = AVGXAPACHE_D
        HideSubObject       = Blades RotorDisc
      End
      OkToChangeModelColor = Yes
    End
  End
End

CommandButton Command_ConstructAmericaVehicleComanche
  ButtonImage = GXCameo_Apache
End

; Humvee -> modern light tactical vehicle with a remote weapon station
Object AmericaVehicleHumvee
  SelectPortrait = GXCameo_JLTV_L
  ButtonImage    = GXCameo_JLTV

  ReplaceModule ModuleTag_01
    Draw = W3DTruckDraw ModuleTag_01_GX
      OkToChangeModelColor = Yes
      ConditionState = NONE
        Model = AVGXJLTV
        Turret = Turret
        ShowSubObject = Turret
        HideSubObject = TurretUp01 Housecolor03 MuzzleFXUP01
        WeaponFireFXBone = PRIMARY Muzzle
        WeaponMuzzleFlash = PRIMARY MuzzleFX
      End
      ConditionState = REALLYDAMAGED
        Model = AVGXJLTV_D
        Turret = Turret
        ShowSubObject = Turret
        HideSubObject = TurretUp01 Housecolor03 MuzzleFXUP01
        WeaponFireFXBone = PRIMARY Muzzle
        WeaponMuzzleFlash = PRIMARY MuzzleFX
      End
      ConditionState = WEAPONSET_PLAYER_UPGRADE
        Model = AVGXJLTV
        Turret = TurretUp01
        HideSubObject = Turret MuzzleFX01
        ShowSubObject = TurretUp01 Housecolor03
        WeaponFireFXBone = PRIMARY MuzzleUp
        WeaponMuzzleFlash = PRIMARY MuzzleFXUp
        WeaponFireFXBone = SECONDARY WeaponB
        WeaponLaunchBone = SECONDARY WeaponB
        WeaponFireFXBone = TERTIARY WeaponB
        WeaponLaunchBone = TERTIARY WeaponB
      End
      ConditionState = REALLYDAMAGED WEAPONSET_PLAYER_UPGRADE
        Model = AVGXJLTV_D
        Turret = TurretUp01
        HideSubObject = Turret MuzzleFX01
        ShowSubObject = TurretUp01 Housecolor03
        WeaponFireFXBone = PRIMARY MuzzleUp
        WeaponMuzzleFlash = PRIMARY MuzzleFXUp
        WeaponFireFXBone = SECONDARY WeaponB
        WeaponLaunchBone = SECONDARY WeaponB
        WeaponFireFXBone = TERTIARY WeaponB
        WeaponLaunchBone = TERTIARY WeaponB
      End
      TrackMarks = EXTireTrack.tga
      Dust = RocketBuggyDust
      DirtSpray = RocketBuggyDirtSpray
      PowerslideSpray = RocketBuggyDirtPowerSlide
      LeftFrontTireBone = Tire01
      RightFrontTireBone = Tire02
      LeftRearTireBone = Tire03
      RightRearTireBone = Tire04
      TireRotationMultiplier = 0.2
      PowerslideRotationAddition = 1.25
    End
  End
End

CommandButton Command_ConstructAmericaVehicleHumvee
  ButtonImage = GXCameo_JLTV
End

; Tomahawk -> modern tracked rocket launcher
Object AmericaVehicleTomahawk
  SelectPortrait = GXCameo_MLRS_L
  ButtonImage    = GXCameo_MLRS

  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_01_GX
      OkToChangeModelColor = Yes
      ProjectileBoneFeedbackEnabledSlots = PRIMARY
      DefaultConditionState
        Model = AVGXMLRS
        Turret = TURRET
        TurretPitch = TURRETEL
        WeaponLaunchBone = PRIMARY WeaponA
        WeaponHideShowBone = PRIMARY MISSILE
      End
      ConditionState = REALLYDAMAGED
        Model = AVGXMLRS_D
      End
      AliasConditionState = RUBBLE
      TrackMarks = EXTnkTrack.tga
    End
  End
End

CommandButton Command_ConstructAmericaVehicleTomahawk
  ButtonImage = GXCameo_MLRS
End
