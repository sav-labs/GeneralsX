; GeneralsX content: modern art for USA vehicles.
; Loaded before every game (like map.ini). Only what is drawn changes: the retail Draw modules, stats,
; weapons, sounds and behaviour stay as they are. ArtRemap draws the pack's models where the retail INI
; names a retail model; logic still reads bones (launch points, turrets, ropes) from the retail model, so
; matches and replays play out the same with or without this pack.

ArtRemap
  ; Crusader -> modern main battle tank
  Model     = AVLeopard     AVGXMBT
  Model     = AVLeopard_D   AVGXMBT_D
  ; Paladin -> modern tank with reactive armour and a laser point-defence turret
  Model     = AVPaladin     AVGXPAL
  Model     = AVPaladin_D   AVGXPAL_D
  ; Dozer -> modern armoured bulldozer (the blade is fixed; the retail digging animation does not play)
  Model     = AVCONSTDOZ_A  AVGXDOZ
  Model     = AVCONSTDOZ_AD AVGXDOZ_D
  ; Humvee -> modern light tactical vehicle with a remote weapon station
  Model     = AVHUMMER      AVGXJLTV
  Model     = AVHUMMER_d    AVGXJLTV_D
  ; Tomahawk -> modern tracked rocket launcher
  Model     = AVTomahawk    AVGXMLRS
  Model     = AVTomahawk_D  AVGXMLRS_D
  ; Comanche -> modern attack helicopter
  Model     = AVComanche    AVGXAPACHE
  Model     = AVComanche_d  AVGXAPACHE_D
  Animation = AVComanche.AVComanche     AVGXAPACHE.AVGXAPACHE
  Animation = AVComanche_d.AVComanche_d AVGXAPACHE_D.AVGXAPACHE_D
  ; Chinook -> modern tandem-rotor transport (the retail cargo net model stays)
  Model     = AVChinook     AVGXCHINOOK
  Model     = AVChinook_d   AVGXCHINOOK_D
  Animation = AVChinook.AVChinook       AVGXCHINOOK.AVGXCHINOOK
  Animation = AVChinook_d.AVChinook_d   AVGXCHINOOK_D.AVGXCHINOOK_D
  ; Microwave Tank -> directed-energy tank with a phased-array emitter
  Model     = AVTHUNDRBLT   AVGXMICRO
  Model     = AVTHUNDRBLT_D AVGXMICRO_D
  ; Ambulance -> armoured field ambulance with a decontamination sprayer
  Model     = AVAmbulance   AVGXMEDIC
  Model     = AVAmbulance_D AVGXMEDIC_D
End

