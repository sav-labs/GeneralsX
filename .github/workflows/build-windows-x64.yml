name: Build Windows x64 (experimental)

# GeneralsX @build Claude 11/10/2026 Experimental 64-bit Windows build (MSVC + vcpkg x64-windows).
# Needed for upscalers such as FSR and DLSS, which only ship 64-bit runtimes.

permissions:
  contents: read

# GeneralsX @build Claude 15/10/2026 Also build every push to main, so main always has a Windows x64 artifact.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GeneralsX @build Claude 12/10/2026 DXVK 2.6 for Windows with FSR 1.0 (EASU upscale + RCAS sharpening) in the swap chain blitter.
  # The patch lives in cmake/dxvk-patches; set DXVK_FSR=1 and run the game with -upscale to use it.
  # DXVK_FSR_SHARPNESS sets RCAS sharpening in stops (0 = sharpest, default 0.2).
  # A multisampled back buffer (Options.ini AntiAliasing) is resolved before the FSR EASU pass.
  # d3d9.log reports each back buffer's MultiSampleType and, on every change, whether FSR is active.
  # DXVK_POST=1 adds bloom and a light colour grade (0006-present-post.patch); the game sets it and DXVK_FXAA
  # from Options.ini PostEffects (default yes) unless they are already set. DXVK_BLOOM,
  # DXVK_BLOOM_THRESHOLD, DXVK_SATURATION and DXVK_CONTRAST tune it.
  # DXVK_FXAA=1 smooths edges of a single-sampled back buffer with FXAA (0007-present-fxaa.patch).
  # Soft particles (0008-d3d9-soft-particles.patch): the game marks its particle draws with render state 254 and DXVK
  # fades them where they meet the scene depth behind them. On by default, DXVK_SOFT_PARTICLES=0 turns it off.
  # DXVK_CAPTURE_PATH=<file.png> saves the presented image every DXVK_CAPTURE_INTERVAL seconds (default 10).
  # DXVK_CAPTURE_VIDEO records every presented frame for DXVK_CAPTURE_VIDEO_SECONDS (default 10), starting
  # DXVK_CAPTURE_VIDEO_START seconds (default 5) after the first present, at DXVK_CAPTURE_VIDEO_SCALE percent
  # (default 50) of the presented size, with the DXVK HUD. raw:<path> writes <path>.bgra and <path>.txt
  # (scripts/qa/dxvk_video_to_mp4.py turns them into an mp4); any other value is a command that reads
  # Matroska raw BGRA video with present time stamps on stdin, e.g.
  # ffmpeg -y -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode passthrough -enc_time_base -1 clip.mp4
  # GeneralsX @feature Claude 15/10/2026 DXVK_CAPTURE_VIDEO_START=camtest (patch 0011) starts recording with the first frame
  # of the -camtest flight instead of a fixed time, so A/B clips line up whatever the load time. The game sets the process
  # environment variable DXVK_CAPTURE_VIDEO_SIGNAL to camtest.prepare when the match starts and to camtest when the flight begins.
  # GeneralsX @feature Claude 15/10/2026 Without DXVK_CAPTURE_VIDEO, the game starts and stops clips at run time through
  # DXVK_CAPTURE_VIDEO_CONTROL (patch 0012): F11 or Ctrl+Shift+R records a bug report video into Options.ini CapturePath
  # (default D:\GeneralsX\bugs), encoded to mp4 by a helper copy of GeneralsXZH.exe with the FFmpeg DLLs it ships.
  # GeneralsX @feature Claude 16/10/2026 Detailed unit models: built and baked with Blender's Python module (bpy) from
  # scripts/tooling/content/blend, cached on the hash of those scripts so a push that does not touch them reuses the
  # last bake. The Windows job folds them into the content pack (build_content.py --hd).
  # GeneralsX @feature Claude 16/10/2026 Most units now come from openly licensed source models (release model-sources,
  # see model-sources.yml) through blend/build_src.py; their CREDITS.md ships next to the content pack.
  hd-models:
    name: Detailed models (Blender)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/tooling/content

      - name: Download source models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Openly licensed source models and their CREDITS.md, fetched by model-sources.yml.
          gh release download model-sources --repo "${{ github.repository }}" --dir src --pattern '*.glb' --pattern CREDITS.md

      - name: Cache baked models
        id: cache
        uses: actions/cache@v4
        with:
          path: hd-out
          key: hd-models-${{ hashFiles('scripts/tooling/content/blend/**', 'scripts/tooling/content/w3d.py', 'scripts/tooling/content/textures.py', 'src/**') }}

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and bake
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          python -m pip install bpy==5.2.2 pillow==12.0.0 numpy==2.2.6
          python scripts/tooling/content/blend/build_hd.py hd-out
          # Units whose spec has passed review; the rest of sources.py is still being tuned.
          python scripts/tooling/content/blend/build_src.py src hd-out --only crusader
          rm -f hd-out/tex/*.blend
          cp src/CREDITS.md hd-out/CREDITS.md

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: hd-models
          path: |
            hd-out/w3d
            hd-out/tex/*.tga
            hd-out/cameos
            hd-out/CREDITS.md
          retention-days: 3

  dxvk-fsr:
    name: DXVK with FSR (Win64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: cmake/dxvk-patches

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 glslang-tools ninja-build python3-pip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          pip3 install --user --break-system-packages meson

      - name: Build DXVK
        run: |
          git clone --depth 1 --branch v2.6 --recurse-submodules --shallow-submodules https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          for patch in ../cmake/dxvk-patches/*.patch; do git apply "$patch"; done
          ~/.local/bin/meson setup --cross-file build-win64.txt --buildtype release \
            -Denable_d3d10=false -Denable_d3d11=false -Denable_dxgi=false build
          ninja -C build src/d3d8/d3d8.dll src/d3d9/d3d9.dll
          mkdir -p ../dxvk-out
          cp build/src/d3d8/d3d8.dll build/src/d3d9/d3d9.dll ../dxvk-out/

      - name: Upload DXVK
        uses: actions/upload-artifact@v7
        with:
          name: dxvk-fsr-win64
          path: dxvk-out
          retention-days: 7

  build-windows-x64:
    name: Zero Hour x64
    needs: [dxvk-fsr, hd-models]
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-

      - name: Configure vcpkg cache directory
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}/vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_PORTS=${{ github.workspace }}/cmake/ports" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset win64-vcpkg `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake/ports" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" `
            -DRTS_BUILD_GENERALS=OFF `
            -DRTS_BUILD_ZEROHOUR=ON `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DX8=ON `
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Save vcpkg binary cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset win64-vcpkg --target z_generals -- -k 0 *>&1 | Tee-Object -FilePath build.log | Out-Null
          exit $LASTEXITCODE

      - name: Show build errors
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern 'error C|error LNK|fatal error|FAILED:' |
            ForEach-Object { $_.Line } | Select-Object -First 400

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Download DXVK with FSR
        uses: actions/download-artifact@v8
        with:
          name: dxvk-fsr-win64
          path: dxvk-fsr

      # GeneralsX @feature Claude 15/10/2026 Build the content pack (our own models, textures, cameos and INI
      # overrides) from scripts/tooling/content and content/. It holds no retail data.
      - name: Set up Python for content
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download detailed models
        uses: actions/download-artifact@v8
        with:
          name: hd-models
          path: hd-models

      - name: Build content pack
        shell: pwsh
        run: |
          python -m pip install pillow==12.0.0 numpy==2.2.6
          python scripts/tooling/content/test_content.py --hd hd-models
          python scripts/tooling/content/build_content.py . content-out --hd hd-models

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item content-out/GeneralsXContent.big artifacts/
          # Authors and licences of the third-party models in the content pack (CC-BY asks for credit).
          if (Test-Path hd-models/CREDITS.md) { Copy-Item hd-models/CREDITS.md artifacts/GeneralsXContent-CREDITS.md }
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.exe artifacts/
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.pdb artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem -Path @("vcpkg_installed/x64-windows/bin/*.dll", "build/win64-vcpkg/vcpkg_installed/x64-windows/bin/*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifacts/
          }
          if (Test-Path "assets/fonts") {
            New-Item -ItemType Directory -Force artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* artifacts/fonts/
          }
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1
          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          }
          # GeneralsX @build Claude 12/10/2026 Ship DXVK so the x64 build renders through Vulkan like Linux/macOS.
          Copy-Item dxvk-fsr/d3d8.dll, dxvk-fsr/d3d9.dll artifacts/
          @"
          @echo off
          rem Borderless window at display size; the game renders at its own resolution and FSR 1.0 upscales it.
          set DXVK_FSR=1
          set DXVK_POST=1
          set DXVK_FXAA=1
          start "" "%~dp0GeneralsXZH.exe" -upscale %*
          "@ | Set-Content artifacts/Play-FSR.cmd -Encoding ascii
          @"
          Experimental 64-bit build. Copy these files into a separate copy of a licensed
          Zero Hour installation. Audio uses MiniAudio and videos use FFmpeg, because the
          original 32-bit mss32.dll and binkw32.dll cannot be loaded by a 64-bit game.
          Rendering goes through DXVK (Vulkan); delete d3d8.dll and d3d9.dll to use native DirectX 8.
          Play-FSR.cmd runs borderless at display size and upscales the game resolution with FSR 1.0.
          To soften the FSR sharpening, edit Play-FSR.cmd and add: set DXVK_FSR_SHARPNESS=1 (0 is sharpest, default 0.2).
          The game adds bloom and a light colour grade, and smooths edges with FXAA when anti-aliasing is off in the
          game options. PostEffects = no in Options.ini turns both off. Tune the bloom with DXVK_BLOOM=0.25,
          DXVK_SATURATION=1.1 and DXVK_CONTRAST=1.05 (1 = unchanged) in the environment or in Play-FSR.cmd.
          For testing, set DXVK_CAPTURE_PATH to a .png file to save the game image every DXVK_CAPTURE_INTERVAL seconds (default 10).
          For testing, set DXVK_CAPTURE_VIDEO=raw:C:\cap\clip to record every frame (default: 10 s starting 5 s after launch, at 50% size)
          into clip.bgra and clip.txt (frame size and present times). DXVK_CAPTURE_VIDEO_START, DXVK_CAPTURE_VIDEO_SECONDS and
          DXVK_CAPTURE_VIDEO_SCALE change the window and size; set DXVK_HUD=fps,frametimes to include the HUD in the video.
          With -camtest, set DXVK_CAPTURE_VIDEO_START=camtest to start recording with the first frame of the camera flight
          (DXVK_CAPTURE_VIDEO_SECONDS then counts from there), so clips of different runs line up whatever the load time.
          With ffmpeg.exe on PATH, DXVK_CAPTURE_VIDEO can instead be an encoder command that reads the video on stdin:
          ffmpeg -y -loglevel error -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode passthrough -enc_time_base -1 C:\cap\clip.mp4
          Bug reports: F12 saves a JPG screenshot, Ctrl+F12 or Ctrl+Shift+S a PNG screenshot, and F11 or Ctrl+Shift+R
          starts and stops a video (mp4, at most 1080 lines). Files are named by date and time and go to D:\GeneralsX\bugs,
          or to CapturePath in Options.ini (for example CapturePath = E:\Captures); when that folder cannot be created,
          they go to the bugs folder in the game's user data folder. Video recording needs the d3d8.dll and d3d9.dll above.
          Pick the game resolution in Options; use the same aspect ratio as the display.
          GeneralsXContent.big holds the remaster's own models (e.g. a modern tank in place of the USA Crusader);
          delete it to play with the original look. Unit stats and gameplay are unchanged either way.
          FSR without Play-FSR.cmd: in Options > Resolution pick an "(FSR 77%)" to "(FSR 50%)" entry and restart
          the game, or start GeneralsXZH.exe -renderscale 67. Pick a normal resolution to turn it off.
          "@ | Set-Content artifacts/INSTALL.txt
          # GeneralsX @build Claude 16/10/2026 version.txt names the commit and run the package was built from.
          @"
          commit=${{ github.sha }}
          branch=${{ github.ref_name }}
          run_id=${{ github.run_id }}
          built_utc=$((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          "@ | Set-Content artifacts/version.txt
          Copy-Item artifacts/version.txt version.txt
          Compress-Archive -Path artifacts/* -DestinationPath windows-x64-GeneralsXZH.zip

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-GeneralsXZH.zip
          path: windows-x64-GeneralsXZH.zip
          archive: false
          retention-days: 7

  # GeneralsX @build Claude 16/10/2026 Every green build of main replaces the zip on the "nightly-x64" release, so the
  # test PC downloads the latest main build from a fixed public link without a token or another machine:
  # https://github.com/sav-labs/GeneralsX/releases/download/nightly-x64/windows-x64-GeneralsXZH.zip
  publish-nightly:
    name: Publish nightly-x64 release
    needs: build-windows-x64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-nightly-x64
      cancel-in-progress: false
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-GeneralsXZH.zip
          path: package

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find package -maxdepth 2 | head -n 20
          zip=$(find package -type f -name '*.zip' | head -n 1)
          if [ -n "$zip" ]; then
            unzip -p "$zip" version.txt > version.txt
            if [ "$(basename "$zip")" != windows-x64-GeneralsXZH.zip ]; then
              cp "$zip" windows-x64-GeneralsXZH.zip
              zip=windows-x64-GeneralsXZH.zip
            fi
          else
            # download-artifact unpacks the zip; rebuild it from the extracted files
            cp package/version.txt version.txt
            (cd package && zip -qr ../windows-x64-GeneralsXZH.zip .)
            zip=windows-x64-GeneralsXZH.zip
          fi
          cat version.txt
          if ! gh release view nightly-x64 >/dev/null 2>&1; then
            gh release create nightly-x64 --target "$GITHUB_SHA" --prerelease \
              --title "Nightly Windows x64" --notes "Latest green Windows x64 build of main."
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly-x64" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit nightly-x64 --notes "Latest green Windows x64 build of main: commit $GITHUB_SHA, run $GITHUB_RUN_ID ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          gh release upload nightly-x64 "$zip" version.txt --clobber
