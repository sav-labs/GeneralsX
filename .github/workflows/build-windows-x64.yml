name: Build Windows x64 (experimental)

# GeneralsX @build Claude 11/10/2026 Experimental 64-bit Windows build (MSVC + vcpkg x64-windows).
# Needed for upscalers such as FSR and DLSS, which only ship 64-bit runtimes.

permissions:
  contents: read

# GeneralsX @build Claude 15/10/2026 Also build every push to main, so main always has a Windows x64 artifact.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GeneralsX @build Claude 12/10/2026 DXVK 2.6 for Windows with FSR 1.0 (EASU upscale + RCAS sharpening) in the swap chain blitter.
  # The patch lives in cmake/dxvk-patches; set DXVK_FSR=1 and run the game with -upscale to use it.
  # DXVK_FSR_SHARPNESS sets RCAS sharpening in stops (0 = sharpest, default 0.2).
  # A multisampled back buffer (Options.ini AntiAliasing) is resolved before the FSR EASU pass.
  # d3d9.log reports each back buffer's MultiSampleType and, on every change, whether FSR is active.
  # DXVK_POST=1 adds bloom and a light colour grade (0006-present-post.patch); the game sets it and DXVK_FXAA
  # from Options.ini PostEffects (default yes) unless they are already set. DXVK_BLOOM,
  # DXVK_BLOOM_THRESHOLD, DXVK_SATURATION and DXVK_CONTRAST tune it.
  # DXVK_FXAA=1 smooths edges of a single-sampled back buffer with FXAA (0007-present-fxaa.patch).
  # Soft particles (0008-d3d9-soft-particles.patch): the game marks its particle draws with render state 254 and DXVK
  # fades them where they meet the scene depth behind them. On by default, DXVK_SOFT_PARTICLES=0 turns it off.
  # Ambient occlusion (0009-d3d9-ssao.patch): the game sets render state 253 after its opaque geometry and DXVK darkens
  # creases and contact areas from the depth buffer. DXVK_SSAO=1 enables it; the game sets it from Options.ini
  # AmbientOcclusion (default yes) unless it is already set. DXVK_SSAO_STRENGTH (default 0.6) and DXVK_SSAO_RADIUS
  # (world units, default 12) tune it.
  # DXVK_CAPTURE_PATH=<file.png> saves the presented image every DXVK_CAPTURE_INTERVAL seconds (default 10).
  # DXVK_CAPTURE_VIDEO records every presented frame for DXVK_CAPTURE_VIDEO_SECONDS (default 10), starting
  # DXVK_CAPTURE_VIDEO_START seconds (default 5) after the first present, at DXVK_CAPTURE_VIDEO_SCALE percent
  # (default 50) of the presented size, with the DXVK HUD. raw:<path> writes <path>.bgra and <path>.txt
  # (scripts/qa/dxvk_video_to_mp4.py turns them into an mp4); any other value is a command that reads
  # Matroska raw BGRA video with present time stamps on stdin, e.g.
  # ffmpeg -y -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode cfr -r 60 clip.mp4
  # GeneralsX @bugfix Claude 16/10/2026 Constant 60 fps output placed by the present time stamps: a variable rate mp4 judders
  # in players that assume a fixed rate. Every presented frame is captured, so a 21 fps battle gives a 21 fps clip.
  # GeneralsX @feature Claude 15/10/2026 DXVK_CAPTURE_VIDEO_START=camtest (patch 0011) starts recording with the first frame
  # of the -camtest flight instead of a fixed time, so A/B clips line up whatever the load time. The game sets the process
  # environment variable DXVK_CAPTURE_VIDEO_SIGNAL to camtest.prepare when the match starts and to camtest when the flight begins.
  # GeneralsX @feature Claude 15/10/2026 Without DXVK_CAPTURE_VIDEO, the game starts and stops clips at run time through
  # DXVK_CAPTURE_VIDEO_CONTROL (patch 0012): F11 or Ctrl+Shift+R records a bug report video into Options.ini CapturePath
  # (default D:\GeneralsX\bugs), encoded to mp4 by a helper copy of GeneralsXZH.exe with the FFmpeg DLLs it ships.
  # GeneralsX @feature Claude 16/10/2026 FSR 2 temporal upscaling (patches 0013 and 0014): DXVK_UPSCALER=fsr2 upscales the
  # 3D scene with AMD FidelityFX FSR 2 (MIT), fetched below at a pinned tag and compiled into d3d9.dll. The game sets it
  # only for Options.ini Upscaler = FSR2 or -upscaler fsr2, jitters its 3D camera, and passes the camera to DXVK through
  # the exported GeneralsX_UpscalerSubmitFrame and render state 252, where DXVK copies the scene colour and depth.
  # GeneralsX @feature Claude 16/10/2026 FSR 2 reactive mask (patch 0015): render state 251 marks the opaque scene before
  # particles and other alpha-blended effects; FSR 2's ffxFsr2ContextGenerateReactiveMask compares that copy with the
  # final scene so effects stop smearing. Options.ini UpscalerReactiveScale / UpscalerSharpness reach DXVK as
  # DXVK_FSR2_REACTIVE_SCALE / DXVK_FSR2_SHARPNESS; DXVK_FSR2_DEBUG=reactive shows the mask.
  # GeneralsX @feature Claude 16/10/2026 FSR 3 (patches 0016 and 0017): DXVK_UPSCALER=fsr3 upscales the 3D scene with the
  # FSR 3.1 upscaler of the AMD FidelityFX SDK v1.1.4 (MIT), fetched below at a pinned tag (GLSL shaders + Vulkan backend
  # only) and compiled into d3d9.dll; without the SDK, DXVK still builds and FSR 3 falls back to FSR 2. DXVK_FSR3_FRAMEGEN=1
  # adds frame generation with the SDK's optical flow and frame interpolation: the swap chain presents a generated frame,
  # then the real one, and the interface always comes from the real frame. The game sets both from Options.ini
  # Upscaler = FSR3 / FrameGeneration = yes or -upscaler fsr3 / -framegen on.
  # GeneralsX @bugfix Claude 17/10/2026 FSR 3 crashed creating its first context (the SDK backend got the device's
  # vkGetDeviceProcAddr, so vkGetBufferMemoryRequirements2KHR was NULL); frame generation errors now turn it off.
  # GeneralsX @performance Claude 17/10/2026 FSR 2 / FSR 3: 10-bit output images, sharpening in the composite pass,
  # DXVK_FSR_TIMING=1 logs the GPU time of each upscaler pass.
  # GeneralsX @feature Claude 16/10/2026 Detailed unit models: built and baked with Blender's Python module (bpy) from
  # scripts/tooling/content/blend, cached on the hash of those scripts so a push that does not touch them reuses the
  # last bake. The Windows job folds them into the content pack (build_content.py --hd).
  # GeneralsX @feature Claude 16/10/2026 Most units now come from openly licensed source models (release model-sources,
  # see model-sources.yml) through blend/build_src.py; their CREDITS.md ships next to the content pack.
  hd-models:
    name: Detailed model (Blender)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # One reviewed detailed model per job: each bake runs ~75 min, so several units in one job
      # would blow the 90 min timeout. Parallel jobs, one artifact per unit; build_content.py
      # HD_REMAP decides which of the baked models actually ship. fail-fast off so one bad unit
      # does not cancel the rest.
      fail-fast: false
      matrix:
        unit:
          - crusader_m1a2
          - microwave
          - avenger
          - paladin
          - tomahawk
          - humvee
          - ambulance
          - bulldozer

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # hdpack holds the mipmapped DDS writer the normal maps use.
          sparse-checkout: |
            scripts/tooling/content
            scripts/tooling/hdpack

      - name: Download source models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Openly licensed source models and their CREDITS.md, fetched by model-sources.yml.
          gh release download model-sources --repo "${{ github.repository }}" --dir src --pattern '*.glb' --pattern CREDITS.md

      - name: Cache baked model
        id: cache
        uses: actions/cache@v4
        with:
          path: hd-out
          key: hd-models-${{ matrix.unit }}-${{ hashFiles('scripts/tooling/content/blend/**', 'scripts/tooling/content/w3d.py', 'scripts/tooling/content/textures.py', 'src/**') }}

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and bake
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          python -m pip install bpy==5.2.2 pillow==12.0.0 numpy==2.2.6
          mkdir -p hd-out/tex
          python scripts/tooling/content/blend/build_src.py src hd-out --only ${{ matrix.unit }}
          rm -f hd-out/tex/*.blend
          cp src/CREDITS.md hd-out/CREDITS.md

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: hd-models-${{ matrix.unit }}
          path: |
            hd-out/w3d
            hd-out/tex/*.tga
            hd-out/tex/*_n.dds
            hd-out/cameos
            hd-out/CREDITS.md
          retention-days: 3

  dxvk-fsr:
    name: DXVK with FSR (Win64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: cmake/dxvk-patches

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 glslang-tools ninja-build python3-pip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          pip3 install --user --break-system-packages meson

      - name: Build DXVK
        run: |
          git clone --depth 1 --branch v2.6 --recurse-submodules --shallow-submodules https://github.com/doitsujin/dxvk.git dxvk
          git clone --depth 1 --branch v2.2.1 https://github.com/GPUOpen-Effects/FidelityFX-FSR2.git fsr2
          # FidelityFX SDK v1.1.4 (FSR 3.1.4): only the SDK headers and sources are needed
          git clone --depth 1 --branch v1.1.4 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx-sdk
          git -C ffx-sdk sparse-checkout set sdk/include sdk/src
          cd dxvk
          for patch in ../cmake/dxvk-patches/*.patch; do git apply "$patch"; done
          # FSR 2 core and Vulkan backend; patch 0013 builds them with its own shader table
          cp -r ../fsr2/src/ffx-fsr2-api src/dxvk/fsr2/ffx-fsr2-api
          cp ../fsr2/LICENSE.txt ../fsr2-LICENSE.txt
          # FSR 3 upscaler, frame interpolation and optical flow; patch 0016 builds them with its own shader table
          mkdir -p src/dxvk/fsr3/ffx-sdk
          cp -r ../ffx-sdk/sdk/include ../ffx-sdk/sdk/src ../ffx-sdk/LICENSE.txt src/dxvk/fsr3/ffx-sdk/
          ~/.local/bin/meson setup --cross-file build-win64.txt --buildtype release \
            -Denable_d3d10=false -Denable_d3d11=false -Denable_dxgi=false build
          ninja -C build src/d3d8/d3d8.dll src/d3d9/d3d9.dll
          x86_64-w64-mingw32-objdump -p build/src/d3d9/d3d9.dll | grep -q GeneralsX_UpscalerSubmitFrame
          x86_64-w64-mingw32-objdump -p build/src/d3d9/d3d9.dll | grep -q GeneralsX_GetSyncStats
          test -f build/src/dxvk/libdxvk_fsr3.a
          mkdir -p ../dxvk-out
          cp build/src/d3d8/d3d8.dll build/src/d3d9/d3d9.dll ../dxvk-out/
          cp ../fsr2-LICENSE.txt ../dxvk-out/FidelityFX-FSR2-LICENSE.txt
          cp ../ffx-sdk/LICENSE.txt ../dxvk-out/FidelityFX-SDK-LICENSE.txt

      - name: Upload DXVK
        uses: actions/upload-artifact@v7
        with:
          name: dxvk-fsr-win64
          path: dxvk-out
          retention-days: 7

  build-windows-x64:
    name: Zero Hour x64
    needs: [dxvk-fsr, hd-models]
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-

      - name: Configure vcpkg cache directory
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}/vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_PORTS=${{ github.workspace }}/cmake/ports" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset win64-vcpkg `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake/ports" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" `
            -DRTS_BUILD_GENERALS=OFF `
            -DRTS_BUILD_ZEROHOUR=ON `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DX8=ON `
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Save vcpkg binary cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset win64-vcpkg --target z_generals -- -k 0 *>&1 | Tee-Object -FilePath build.log | Out-Null
          exit $LASTEXITCODE

      - name: Show build errors
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern 'error C|error LNK|fatal error|FAILED:' |
            ForEach-Object { $_.Line } | Select-Object -First 400

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Download DXVK with FSR
        uses: actions/download-artifact@v8
        with:
          name: dxvk-fsr-win64
          path: dxvk-fsr

      # GeneralsX @feature Claude 15/10/2026 Build the content pack (our own models, textures, cameos and INI
      # overrides) from scripts/tooling/content and content/. It holds no retail data.
      - name: Set up Python for content
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download detailed models
        uses: actions/download-artifact@v8
        with:
          # One artifact per unit from the hd-models matrix; merge them into a single folder.
          pattern: hd-models-*
          merge-multiple: true
          path: hd-models

      - name: Build content pack
        shell: pwsh
        run: |
          python -m pip install pillow==12.0.0 numpy==2.1.3
          python scripts/tooling/content/test_content.py --hd hd-models
          python scripts/tooling/maps/test_maps.py
          python scripts/tooling/content/build_content.py . content-out --hd hd-models

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item content-out/GeneralsXContent.big artifacts/
          # Authors and licences of the third-party models in the content pack (CC-BY asks for credit).
          if (Test-Path hd-models/CREDITS.md) { Copy-Item hd-models/CREDITS.md artifacts/GeneralsXContent-CREDITS.md }
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.exe artifacts/
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.pdb artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem -Path @("vcpkg_installed/x64-windows/bin/*.dll", "build/win64-vcpkg/vcpkg_installed/x64-windows/bin/*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifacts/
          }
          if (Test-Path "assets/fonts") {
            New-Item -ItemType Directory -Force artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* artifacts/fonts/
          }
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1
          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          }
          # GeneralsX @build Claude 12/10/2026 Ship DXVK so the x64 build renders through Vulkan like Linux/macOS.
          Copy-Item dxvk-fsr/d3d8.dll, dxvk-fsr/d3d9.dll, dxvk-fsr/FidelityFX-FSR2-LICENSE.txt, dxvk-fsr/FidelityFX-SDK-LICENSE.txt artifacts/
          @"
          @echo off
          rem Borderless window at display size; the game renders at its own resolution and FSR 1.0 upscales it.
          set DXVK_FSR=1
          set DXVK_POST=1
          set DXVK_FXAA=1
          start "" "%~dp0GeneralsXZH.exe" -upscale %*
          "@ | Set-Content artifacts/Play-FSR.cmd -Encoding ascii
          # GeneralsX @performance Claude 16/10/2026 Frame profiler launcher for big battle measurements.
          @"
          @echo off
          rem Frame profiler: a [PERF] summary every 5 s goes to perf-log.txt next to the game, and a per frame CSV
          rem of 300 s of the next match, starting 60 s after the match begins, goes to the capture folder.
          rem Extra arguments are passed on, for example: Perf.cmd -skirmish "Maps\<map>\<map>.map" 7
          "%~dp0GeneralsXZH.exe" -perf -perfdump 300 60 %* 2> "%~dp0perf-log.txt"
          "@ | Set-Content artifacts/Perf.cmd -Encoding ascii
          @"
          Experimental 64-bit build. Copy these files into a separate copy of a licensed
          Zero Hour installation. Audio uses MiniAudio and videos use FFmpeg, because the
          original 32-bit mss32.dll and binkw32.dll cannot be loaded by a 64-bit game.
          Rendering goes through DXVK (Vulkan); delete d3d8.dll and d3d9.dll to use native DirectX 8.
          Play-FSR.cmd runs borderless at display size and upscales the game resolution with FSR 1.0.
          To soften the FSR sharpening, edit Play-FSR.cmd and add: set DXVK_FSR_SHARPNESS=1 (0 is sharpest, default 0.2).
          The game adds bloom and a light colour grade, and smooths edges with FXAA when anti-aliasing is off in the
          game options. PostEffects = no in Options.ini turns both off. Tune the bloom with DXVK_BLOOM=0.25,
          DXVK_SATURATION=1.1 and DXVK_CONTRAST=1.05 (1 = unchanged) in the environment or in Play-FSR.cmd.
          Ambient occlusion adds soft shade where units and buildings meet the ground. AmbientOcclusion = no in
          Options.ini turns it off; DXVK_SSAO_STRENGTH=0.6 and DXVK_SSAO_RADIUS=12 tune it.
          Close-up terrain: TerrainDetail = yes adds a fine detail texture to the ground (TerrainDetailStrength,
          0 to 1, default 0.7), TerrainRelief = yes lights the tile surfaces with the map's sun (needs high
          texture quality) and TerrainSoftBlend = yes gives the edges between terrain layers a natural shape.
          Set all three to no for the original ground.
          Model normal maps: unit and building textures that come with a <name>_n.dds (or .tga) normal map get
          per-pixel lighting and a highlight from its gloss. Off by default: ModelNormalMaps = yes in Options.ini turns it on;
          ModelSpecular = 0 to 2 (default 1) sets the highlight strength. Models without _n maps look as before.
          For testing, set DXVK_CAPTURE_PATH to a .png file to save the game image every DXVK_CAPTURE_INTERVAL seconds (default 10).
          For testing, set DXVK_CAPTURE_VIDEO=raw:C:\cap\clip to record every frame (default: 10 s starting 5 s after launch, at 50% size)
          into clip.bgra and clip.txt (frame size and present times). DXVK_CAPTURE_VIDEO_START, DXVK_CAPTURE_VIDEO_SECONDS and
          DXVK_CAPTURE_VIDEO_SCALE change the window and size; set DXVK_HUD=fps,frametimes to include the HUD in the video.
          With -camtest, set DXVK_CAPTURE_VIDEO_START=camtest to start recording with the first frame of the camera flight
          (DXVK_CAPTURE_VIDEO_SECONDS then counts from there), so clips of different runs line up whatever the load time.
          -camtest 10 battle spawns your column and one of the AI opponent's side facing each other in front of your base,
          sets a building near them on fire and circles the fight for 10 s; add a unit count for both sides together
          (-camtest 10 battle 60) and night for a night match (-camtest 10 battle 60 night). Use it with -skirmish.
          With ffmpeg.exe on PATH, DXVK_CAPTURE_VIDEO can instead be an encoder command that reads the video on stdin:
          ffmpeg -y -loglevel error -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode cfr -r 60 C:\cap\clip.mp4
          Bug reports: F12 saves a JPG screenshot, Ctrl+F12 or Ctrl+Shift+S a PNG screenshot, and F11 or Ctrl+Shift+R
          starts and stops a video (mp4, at most 1080 lines). Files are named by date and time and go to D:\GeneralsX\bugs,
          or to CapturePath in Options.ini (for example CapturePath = E:\Captures); when that folder cannot be created,
          they go to the bugs folder in the game's user data folder. Video recording needs the d3d8.dll and d3d9.dll above.
          Pick the game resolution in Options; use the same aspect ratio as the display. In fullscreen, a Resolution
          the monitor has no mode for (for example 3440 1440 on a 4K monitor) is rendered at that size in a
          borderless window and scaled to fit the screen with its aspect ratio kept (black bars), instead of
          falling back to another resolution. With FSR, RenderScale is a share of that image on screen. The console
          shows [DISPLAY] lines with the screen, Resolution, back buffer and image sizes.
          GeneralsXContent.big holds the remaster's own models (e.g. a modern tank in place of the USA Crusader);
          delete it to play with the original look. Unit stats and gameplay are unchanged either way.
          FSR without Play-FSR.cmd: in Options > Resolution pick an "(FSR 77%)" to "(FSR 50%)" entry and restart
          the game, or start GeneralsXZH.exe -renderscale 67. Pick a normal resolution to turn it off.
          FSR 2 (experimental, off by default): add Upscaler = FSR2 to Options.ini, or start the game with
          -upscaler fsr2 (-upscaler fsr1 or -upscaler off override Options.ini the same way). UpscalerQuality =
          Quality, Balanced, Performance or UltraPerformance picks the render scale (67%, 59%, 50%, 33%) unless
          RenderScale or -renderscale is set. FSR 2 adds detail over several frames. The console and d3d9.log
          show [FSR2] / FSR2: lines with the active upscaler. UpscalerQuality = Native or RenderScale = 100 with
          Upscaler = FSR2 (or FSR3) runs it as anti-aliasing at full resolution, without upscaling. With FSR 2 or
          FSR 3, MSAA (AntiAliasing) is not used: they anti-alias the scene themselves.
          FSR 2 smoke, explosions and particles: UpscalerReactiveScale (0 to 1, default 0.9, 0 = off) tells FSR 2
          to trust the current frame where such effects are drawn, so they do not smear or leave trails.
          FSR 2 sharpening: UpscalerSharpness (0 to 1, default 0.5) is FSR 2's own sharpening of the 3D scene;
          FSRSharpness then only sharpens the interface. UpscalerSharpness = 0 leaves the whole frame to
          FSRSharpness. Nothing is sharpened twice.
          FSR 2 reactive mask check: set DXVK_FSR2_DEBUG=reactive before starting the game (for example
          set DXVK_FSR2_DEBUG=reactive in a .cmd file next to GeneralsXZH.exe). The scene turns grey and every
          pixel FSR 2 treats as an effect shows in red; a blue tint means no mask that frame. Remove the line to
          play normally. DXVK_FSR2_REACTIVE_THRESHOLD (default 0.05) is the smallest change that counts.
          FidelityFX-FSR2-LICENSE.txt is the MIT license of AMD FidelityFX FSR 2, built into d3d9.dll.
          FSR 3 (experimental, off by default): add Upscaler = FSR3 to Options.ini, or start the game with
          -upscaler fsr3. It takes the same UpscalerQuality, UpscalerReactiveScale and UpscalerSharpness settings
          as FSR 2 and shows [FSR3] lines in the console and d3d9.log. If FSR 3 cannot start, FSR 2 takes over.
          FSR 3 frame generation (experimental, off by default, FSR 3 only): add FrameGeneration = yes to
          Options.ini, or start the game with -framegen on (-framegen off overrides Options.ini). Every frame is
          then shown twice: first a frame generated between the previous and the current one, then the real
          frame. The interface is always taken from the real frame. Frame generation adds about one frame of
          latency and works best at 60 fps or more before it is turned on. With vsync, use a display refresh rate
          of at least twice the game frame rate. Debug settings (set them in a .cmd file before the game starts):
          DXVK_FSR3_FRAMEGEN=1 turns frame generation on without Options.ini, DXVK_FSR3_FRAMEGEN_PACING=0 shows
          the real frame right after the generated one instead of half a frame later, and DXVK_FSR3_DEBUG=tearlines,
          view or resets shows the FidelityFX debug overlays (tear lines, the interpolation inputs, camera resets).
          If frame generation fails, an [FSR3] frame generation line says why and the game keeps upscaling
          without it.
          FidelityFX-SDK-LICENSE.txt is the MIT license of the AMD FidelityFX SDK (FSR 3), built into d3d9.dll.
          FSR 2 / FSR 3 GPU time: set DXVK_FSR_TIMING=1 in a .cmd file before the game starts; every 300 frames
          the console and d3d9.log get an [FSR2] (or [FSR3]) GPU time line with the milliseconds of each pass.
          Performance measurement (big battles): Perf.cmd starts the game with the frame profiler. Every 5 seconds
          perf-log.txt gets a [PERF] line: fps, frame time (avg/max), game logic, client update, draw, 3D scene,
          meshes (includes CPU skinning), shadows, particles and present in ms per frame, draw calls, triangles,
          skinned meshes and vertices, skin cache hits, shadow volume rebuilds, particles and texture memory, and
          skinned shadows (skinshadows = drawn, updates = tiles redrawn or volumes rebuilt, skinshadow_ms).
          -perfdump <seconds> [delay] writes one CSV row per frame for <seconds> of the next match, starting
          [delay] seconds after it begins, as perf_<date>_<time>.csv into the capture folder (CapturePath).
          -perf alone only writes the [PERF] lines (-perf 2 every 2 seconds). PerfOverlay = yes in Options.ini
          prints them too and shows four lines of numbers in the top left corner; PerfInterval = 5 sets the period.
          perf-log.txt is only written when the game is started with Perf.cmd (it redirects stderr there); a plain
          -perf run prints the [PERF] lines to stderr only.
          Stutter: every frame of 100 ms or more prints a [PERF] hitch line with that frame's times and what was
          loaded in it: texloads (textures read from disk while drawing, count and ms), modelloads (.w3d files),
          shaders and drawables created. The 5 s line counts hitches and the same loads.
          PreloadAssets = yes (default) loads the models and textures of the map's objects and of the units the
          players' sides can build while the map loads, so they are not read in the middle of the match; stderr
          gets a [PRELOAD] line with the time it took. PreloadAssets = everything preloads every side for every time
          of day (slow, much memory); PreloadAssets = no is the original behaviour.
          Big battle switches in Options.ini (render only, the game itself is unchanged):
          SkinCache = no turns off the skinned vertex cache (default yes; for before/after comparisons).
          ShadowVolumeHighPolyTriangles = 4000 and ShadowVolumeHighPolyAngle = 3: shadow casting parts with at least
          that many triangles rebuild their shadow after 3 degrees of turning instead of 0.2 (0 turns this off).
          ShadowVolumeMaxTriangles = 0: models with more shadow casting triangles than this get a round ground
          shadow instead of a shadow volume (0 = never), or the skinned shadow below when SkinnedShadows is on.
          Shadows of skinned units (tanks, helicopters, mechs made of skinned meshes) follow their real shape:
          SkinnedShadows = Projected (default) draws each unit seen from the sun into a small shadow texture
          and lays it on the ground; only the ground and bridges receive it. SkinnedShadows = Volume uses
          stencil shadow volumes like the other 3D shadows (also falls on other units and on the unit itself,
          more CPU per animated unit). SkinnedShadows = Decal is the old round ground shadow.
          SkinnedShadowQuality = Low | Medium | High (default Medium): shadow texture size 64/128/256 and how
          often animated shadows are redrawn (every 3rd/2nd/every frame).
          SkinnedShadowDistance = 1500: camera distance where they have faded out (0 = no limit).
          SkinnedShadowKeepDecal = no: yes keeps the old round shadow under the new one.
          SkinnedShadowMinTriangles = 2000: units the game gives a round shadow switch to the new shadow only
          from this many triangles, so infantry keep theirs. They follow the 3D Shadows option (2D Shadows
          for units that had a round shadow). stderr gets [SHADOW] lines (settings, each model, every 600 frames).
          Coloured lights from explosions, burning buildings and vehicles, muzzle flashes, missile exhausts and
          superweapons on the ground, units and buildings (strongest at night):
          DynamicLights = High (default): all of them, up to 16 at once, smooth light pools on the ground.
          DynamicLights = Low: explosions, muzzle flashes and superweapons only, up to 6, ground lit on the
          terrain grid like the game's own lights. DynamicLights = Off: only the lights the game data asks for.
          DynamicLightIntensity = 1 (0 to 2): brightness of these lights. stderr gets [LIGHTS] lines; the
          [PERF] line shows lights, retail lights, candidates and lights_ms.
          Water (lakes, ponds and rivers; Options.ini, read when the game starts, render only):
          WaterReflections = Full (default) mirrors the sky, terrain, buildings, units and trees in the water,
          stronger towards the horizon; Sky mirrors only the clouds (cheaper); Off keeps the original water.
          WaterReflectionScale = 0.5 (0.25 to 1): size of the reflection image relative to the 3D view; lower is
          faster and softer. The [PERF] line shows its cost as water_refl (ms per frame).
          ShoreFoam = yes: drifting foam along the shoreline and water that fades in over the first few units of
          depth instead of ending in a hard line. ShoreFoam = no turns both off.
          WaterWaves = yes: small moving waves ripple the reflection and the foam. WaterWaves = no keeps them still.
          WaterReflections = Off, ShoreFoam = no and WaterWaves = no give the original water. stderr gets [WATER]
          lines with the active settings.
          "@ | Set-Content artifacts/INSTALL.txt
          # GeneralsX @build Claude 16/10/2026 version.txt names the commit and run the package was built from.
          @"
          commit=${{ github.sha }}
          branch=${{ github.ref_name }}
          run_id=${{ github.run_id }}
          built_utc=$((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          "@ | Set-Content artifacts/version.txt
          Copy-Item artifacts/version.txt version.txt
          Compress-Archive -Path artifacts/* -DestinationPath windows-x64-GeneralsXZH.zip

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-GeneralsXZH.zip
          path: windows-x64-GeneralsXZH.zip
          archive: false
          retention-days: 7

  # GeneralsX @build Claude 16/10/2026 Every green build of main replaces the zip on the "nightly-x64" release, so the
  # test PC downloads the latest main build from a fixed public link without a token or another machine:
  # https://github.com/sav-labs/GeneralsX/releases/download/nightly-x64/windows-x64-GeneralsXZH.zip
  publish-nightly:
    name: Publish nightly-x64 release
    needs: build-windows-x64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-nightly-x64
      cancel-in-progress: false
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-GeneralsXZH.zip
          path: package

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find package -maxdepth 2 | head -n 20
          zip=$(find package -type f -name '*.zip' | head -n 1)
          if [ -n "$zip" ]; then
            unzip -p "$zip" version.txt > version.txt
            if [ "$(basename "$zip")" != windows-x64-GeneralsXZH.zip ]; then
              cp "$zip" windows-x64-GeneralsXZH.zip
              zip=windows-x64-GeneralsXZH.zip
            fi
          else
            # download-artifact unpacks the zip; rebuild it from the extracted files
            cp package/version.txt version.txt
            (cd package && zip -qr ../windows-x64-GeneralsXZH.zip .)
            zip=windows-x64-GeneralsXZH.zip
          fi
          cat version.txt
          if ! gh release view nightly-x64 >/dev/null 2>&1; then
            gh release create nightly-x64 --target "$GITHUB_SHA" --prerelease \
              --title "Nightly Windows x64" --notes "Latest green Windows x64 build of main."
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly-x64" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit nightly-x64 --notes "Latest green Windows x64 build of main: commit $GITHUB_SHA, run $GITHUB_RUN_ID ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          gh release upload nightly-x64 "$zip" version.txt --clobber
