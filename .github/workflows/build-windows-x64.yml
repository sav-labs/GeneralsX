name: Build Windows x64 (experimental)

# GeneralsX @build Claude 11/10/2026 Experimental 64-bit Windows build (MSVC + vcpkg x64-windows).
# Needed for upscalers such as FSR and DLSS, which only ship 64-bit runtimes.

permissions:
  contents: read

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GeneralsX @build Claude 12/10/2026 DXVK 2.6 for Windows with FSR 1.0 (EASU upscale + RCAS sharpening) in the swap chain blitter.
  # The patch lives in cmake/dxvk-patches; set DXVK_FSR=1 and run the game with -upscale to use it.
  # DXVK_FSR_SHARPNESS sets RCAS sharpening in stops (0 = sharpest, default 0.2).
  # A multisampled back buffer (Options.ini AntiAliasing) is resolved before the FSR EASU pass.
  # DXVK_CAPTURE_PATH=<file.png> saves the presented image every DXVK_CAPTURE_INTERVAL seconds (default 10).
  # DXVK_CAPTURE_VIDEO records every presented frame for DXVK_CAPTURE_VIDEO_SECONDS (default 10), starting
  # DXVK_CAPTURE_VIDEO_START seconds (default 5) after the first present, at DXVK_CAPTURE_VIDEO_SCALE percent
  # (default 50) of the presented size, with the DXVK HUD. raw:<path> writes <path>.bgra and <path>.txt
  # (scripts/qa/dxvk_video_to_mp4.py turns them into an mp4); any other value is a command that reads
  # Matroska raw BGRA video with present time stamps on stdin, e.g.
  # ffmpeg -y -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode passthrough -enc_time_base -1 clip.mp4
  dxvk-fsr:
    name: DXVK with FSR (Win64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: cmake/dxvk-patches

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 glslang-tools ninja-build python3-pip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          pip3 install --user --break-system-packages meson

      - name: Build DXVK
        run: |
          git clone --depth 1 --branch v2.6 --recurse-submodules --shallow-submodules https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          for patch in ../cmake/dxvk-patches/*.patch; do git apply "$patch"; done
          ~/.local/bin/meson setup --cross-file build-win64.txt --buildtype release \
            -Denable_d3d10=false -Denable_d3d11=false -Denable_dxgi=false build
          ninja -C build src/d3d8/d3d8.dll src/d3d9/d3d9.dll
          mkdir -p ../dxvk-out
          cp build/src/d3d8/d3d8.dll build/src/d3d9/d3d9.dll ../dxvk-out/

      - name: Upload DXVK
        uses: actions/upload-artifact@v7
        with:
          name: dxvk-fsr-win64
          path: dxvk-out
          retention-days: 7

  build-windows-x64:
    name: Zero Hour x64
    needs: dxvk-fsr
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/ports/**', 'cmake/triplets/**') }}-
            vcpkg-bincache-v1-${{ runner.os }}-x64-msvc-v143-

      - name: Configure vcpkg cache directory
        shell: pwsh
        run: |
          $cacheDir = "${{ github.workspace }}/vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets" >> $env:GITHUB_ENV
          "VCPKG_OVERLAY_PORTS=${{ github.workspace }}/cmake/ports" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset win64-vcpkg `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/cmake/ports" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" `
            -DRTS_BUILD_GENERALS=OFF `
            -DRTS_BUILD_ZEROHOUR=ON `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DX8=ON `
            -DSAGE_USE_DETERMINISTIC_MATH=ON

      - name: Save vcpkg binary cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset win64-vcpkg --target z_generals -- -k 0 *>&1 | Tee-Object -FilePath build.log | Out-Null
          exit $LASTEXITCODE

      - name: Show build errors
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern 'error C|error LNK|fatal error|FAILED:' |
            ForEach-Object { $_.Line } | Select-Object -First 400

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Download DXVK with FSR
        uses: actions/download-artifact@v8
        with:
          name: dxvk-fsr-win64
          path: dxvk-fsr

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.exe artifacts/
          Copy-Item build/win64-vcpkg/GeneralsMD/Release/GeneralsXZH.pdb artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem -Path @("vcpkg_installed/x64-windows/bin/*.dll", "build/win64-vcpkg/vcpkg_installed/x64-windows/bin/*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifacts/
          }
          if (Test-Path "assets/fonts") {
            New-Item -ItemType Directory -Force artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* artifacts/fonts/
          }
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1
          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          }
          # GeneralsX @build Claude 12/10/2026 Ship DXVK so the x64 build renders through Vulkan like Linux/macOS.
          Copy-Item dxvk-fsr/d3d8.dll, dxvk-fsr/d3d9.dll artifacts/
          @"
          @echo off
          rem Borderless window at display size; the game renders at its own resolution and FSR 1.0 upscales it.
          set DXVK_FSR=1
          start "" "%~dp0GeneralsXZH.exe" -upscale %*
          "@ | Set-Content artifacts/Play-FSR.cmd -Encoding ascii
          @"
          Experimental 64-bit build. Copy these files into a separate copy of a licensed
          Zero Hour installation. Audio uses MiniAudio and videos use FFmpeg, because the
          original 32-bit mss32.dll and binkw32.dll cannot be loaded by a 64-bit game.
          Rendering goes through DXVK (Vulkan); delete d3d8.dll and d3d9.dll to use native DirectX 8.
          Play-FSR.cmd runs borderless at display size and upscales the game resolution with FSR 1.0.
          To soften the FSR sharpening, edit Play-FSR.cmd and add: set DXVK_FSR_SHARPNESS=1 (0 is sharpest, default 0.2).
          For testing, set DXVK_CAPTURE_PATH to a .png file to save the game image every DXVK_CAPTURE_INTERVAL seconds (default 10).
          For testing, set DXVK_CAPTURE_VIDEO=raw:C:\cap\clip to record every frame (default: 10 s starting 5 s after launch, at 50% size)
          into clip.bgra and clip.txt (frame size and present times). DXVK_CAPTURE_VIDEO_START, DXVK_CAPTURE_VIDEO_SECONDS and
          DXVK_CAPTURE_VIDEO_SCALE change the window and size; set DXVK_HUD=fps,frametimes to include the HUD in the video.
          With ffmpeg.exe on PATH, DXVK_CAPTURE_VIDEO can instead be an encoder command that reads the video on stdin:
          ffmpeg -y -loglevel error -i - -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p -fps_mode passthrough -enc_time_base -1 C:\cap\clip.mp4
          Pick the game resolution in Options; use the same aspect ratio as the display.
          FSR without Play-FSR.cmd: in Options > Resolution pick an "(FSR 77%)" to "(FSR 50%)" entry and restart
          the game, or start GeneralsXZH.exe -renderscale 67. Pick a normal resolution to turn it off.
          "@ | Set-Content artifacts/INSTALL.txt
          Compress-Archive -Path artifacts/* -DestinationPath windows-x64-GeneralsXZH.zip

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-GeneralsXZH.zip
          path: windows-x64-GeneralsXZH.zip
          archive: false
          retention-days: 7
